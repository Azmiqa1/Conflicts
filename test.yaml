apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: helm-deployment
spec:
  entrypoint: helm-deployment
  templates:
    - name: helm-deployment
      steps:
        - - name: clone-repo
            template: helm-deployment-clone-repo
        - - name: build-docker-image
            template: helm-deployment-build-docker-image
        - - name: push-docker-image
            template: helm-deployment-push-docker-image
        - - name: deploy-helm
            template: helm-deployment-deploy-helm

    - name: helm-deployment-clone-repo
      container:
        image: alpine/git:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Cloning GitHub repository"
            git clone https://github.com/Azmiqa1/argo_wf.git /workspace/argo_wf
            cd /workspace/argo_wf
            ls -la

    - name: helm-deployment-build-docker-image
      container:
        image: docker:20.10.7
        command: ["/bin/sh", "-c"]
        args:
          - |
             echo "Building Docker image for frontend"
             ls -la /workspace/argo_wf  
             ls -la /workspace/argo_wf/project  
             ls -la /workspace/argo_wf/project/hello-frontend  
             cd /workspace/argo_wf/project/hello-frontend  

    - name: helm-deployment-push-docker-image
      container:
        image: docker:20.10.7
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Pushing Docker image to Docker Hub"
            echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
            docker push azmiqa1/hello-frontend:latest
        envFrom:
        - secretRef:
            name: docker-hub-secret  

    - name: helm-deployment-deploy-helm
      container:
        image: lachlanevenson/k8s-helm:3.6.0
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Deploying with Helm"
            helm repo add stable https://charts.helm.sh/stable
            helm repo update

  volumes:
    - name: workspace-volume
